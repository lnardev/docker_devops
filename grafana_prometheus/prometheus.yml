global:
  scrape_interval: 15s
  evaluation_interval: 15s # Evaluar reglas cada 15s

# Aquí cargamos la regla del 80%
rule_files:
  - "alert_rules.yml"

# Aquí conectamos con Alertmanager
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'mi-servidor'
    static_configs:
      - targets: ['node-exporter:9100']
