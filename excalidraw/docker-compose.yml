version: '3.7'
services:
  excalidraw:
    image: excalidraw/excalidraw:latest
    ports:
      - 8080:80
    volumes:
      - ./data:/app/data
    environment:
      - EXCALIDRAW_DATA_DIR=/app/data
      - EXCALIDRAW_SERVER_PORT=8080
      - EXCALIDRAW_SERVER_HOST=0.0.0.0
      - EXCALIDRAW_SERVER_PROXY=true
    restart: unless-stopped
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'