version: '3.8'

services:
  bookstack-db:
    image: mysql:8.0
    container_name: bookstack-db
    environment:
      - MYSQL_ROOT_PASSWORD=bookstack_root_pass
      - MYSQL_DATABASE=bookstack
      - MYSQL_USER=bookstack
      - MYSQL_PASSWORD=bookstack_pass
    volumes:
      - bookstack-db-data:/var/lib/mysql
    networks:
      - bookstack-network
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password

  bookstack:
    image: lscr.io/linuxserver/bookstack:latest
    container_name: bookstack
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Bogota
      - APP_URL=https://bookstack.zoolve.com
      - APP_KEY=base64:eMWCocRfDzWMvt+S3MSjzEGzlXMHv+4XwFUaPpDxNvk=
      - DB_HOST=bookstack-db
      - DB_PORT=3306
      - DB_DATABASE=bookstack
      - DB_USERNAME=bookstack
      - DB_PASSWORD=bookstack_pass
    volumes:
      - bookstack-app-data:/config
    ports:
      - "6875:80"
    networks:
      - bookstack-network
    depends_on:
      - bookstack-db
    restart: unless-stopped

volumes:
  bookstack-db-data:
  bookstack-app-data:

networks:
  bookstack-network:
    driver: bridge
