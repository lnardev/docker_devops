#       - coverage.xml
#     expire_in: 1 week
#   rules:
#     - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
#     - if: $CI_COMMIT_BRANCH == 'master'
#     - if: $CI_COMMIT_BRANCH == 'main'
#     - if: $CI_COMMIT_BRANCH == 'develop'

# =====================================================
# Stage: SonarQube Analysis
# =====================================================

sonarqube-check:
  stage: sonarqube
  cache:
    policy: pull-push
    key: "sonar-cache-$CI_COMMIT_REF_SLUG"
    paths:
      - "${SONAR_USER_HOME}/cache"
      - sonar-scanner/
  script: 
    - sonar-scanner -Dsonar.host.url="${SONAR_HOST_URL}"
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == 'master'
    - if: $CI_COMMIT_BRANCH == 'main'
    - if: $CI_COMMIT_BRANCH == 'develop'

# =====================================================
# Notas:
# =====================================================
# 1. Asegúrate de configurar las variables en GitLab CI/CD:
#    - SONAR_TOKEN: Token generado en SonarQube
#    - SONAR_HOST_URL: URL de tu servidor SonarQube
#
# 2. El archivo sonar-project.properties debe existir en la raíz
#    del proyecto con la configuración correcta
#
# 3. Si tienes tests, descomenta la sección correspondiente
#    (Node.js o Python) según tu proyecto
#
# 4. GitLab vulnerability report solo está disponible con
#    GitLab Ultimate. No es necesario para SonarQube Community
