# =====================================================
# GitLab CI/CD Pipeline con SonarQube
# =====================================================

image: 
  name: sonarsource/sonar-scanner-cli:11
  entrypoint: [""]

variables:
  # Ubicación del cache de análisis de SonarQube
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
  # Profundidad de git para análisis completo
  GIT_DEPTH: "0"

stages:
  - test
  - sonarqube

# =====================================================
# Stage: Test (Opcional - Descomenta si tienes tests)
# =====================================================

# Para proyectos Node.js/JavaScript/TypeScript
# test:node:
#   image: node:20
#   stage: test
#   script:
#     - npm ci
#     - npm test -- --coverage
#   coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
#   artifacts:
#     reports:
#       coverage_report:
#         coverage_format: cobertura
#         path: coverage/cobertura-coverage.xml
#     paths:
#       - coverage/
#     expire_in: 1 week
#   rules:
#     - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
#     - if: $CI_COMMIT_BRANCH == 'master'
#     - if: $CI_COMMIT_BRANCH == 'main'
#     - if: $CI_COMMIT_BRANCH == 'develop'

# Para proyectos Python
# test:python:
#   image: python:3.11
#   stage: test
#   script:
#     - pip install -r requirements.txt
#     - pytest --cov=. --cov-report=xml
